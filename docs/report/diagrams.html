<!-- 2. Backend architecture -->
<svg id="arch" width="980" height="520" viewBox="0 0 980 520">
  <rect class="box" x="20" y="20" width="160" height="70" rx="8"/>
  <text class="tb" x="38" y="50">Client</text>
  <text class="ts" x="38" y="72">Swagger UI / Postman</text>
  <path class="arrow" d="M180 55 L268 55"/>
  <text class="ts" x="188" y="45">HTTP + JWT</text>

  <rect class="host" x="270" y="15" width="690" height="490" rx="10"/>
  <text class="tb" x="290" y="42">RottenPotatoes.Api (ASP.NET Core Web API)</text>
  <rect class="sec" x="290" y="60" width="650" height="70" rx="8"/>
  <text class="tb" x="308" y="86">Middleware pipeline</text>
  <text class="tl" x="308" y="110">UseAuthentication (validate JWT → 401)  →  UseAuthorization ([Authorize(Roles = "Admin")] → 403)</text>

  <rect class="app" x="290" y="150" width="650" height="80" rx="8"/>
  <text class="tb" x="308" y="176">Controllers</text>
  <text class="tl" x="308" y="200">AuthController · MoviesController · SeriesController · RatingsController</text>
  <text class="ts" x="308" y="220">HTTP status codes (200/201/204/400/401/403/404/409), DTO validation with data annotations</text>

  <rect class="app" x="290" y="250" width="650" height="80" rx="8"/>
  <text class="tb" x="308" y="276">Services (behind interfaces, registered with dependency injection)</text>
  <text class="tl" x="308" y="300">AuthService · MovieService · SeriesService · RatingService</text>
  <text class="ts" x="308" y="320">filtering, sorting, pagination, password hashing, JWT creation, mapping entity → DTO</text>

  <rect class="box" x="290" y="350" width="650" height="70" rx="8"/>
  <text class="tb" x="308" y="376">RottenPotatoes.Data (EF Core + Pomelo MySQL)</text>
  <text class="tl" x="308" y="400">RottenPotatoesDbContext + entities generated by "make scaffold" (Database First)</text>

  <rect class="db" x="290" y="440" width="650" height="50" rx="8"/>
  <text class="tb" x="308" y="471">MySQL rotten_potatoes</text>
  <text class="ts" x="520" y="471">connected as rp_api (SELECT, INSERT, UPDATE, DELETE, EXECUTE)</text>

  <path class="arrow" d="M615 130 L615 148"/>
  <path class="arrow" d="M615 230 L615 248"/>
  <path class="arrow" d="M615 330 L615 348"/>
  <path class="arrow" d="M615 420 L615 438"/>
</svg>

<!-- 3. Login and authorization sequence -->
<svg id="login" width="980" height="560" viewBox="0 0 980 560">
  <rect class="box" x="40" y="20" width="160" height="44" rx="8"/><text class="tb" x="92" y="48">Client</text>
  <rect class="sec" x="300" y="20" width="200" height="44" rx="8"/><text class="tb" x="336" y="48">JWT middleware</text>
  <rect class="app" x="560" y="20" width="180" height="44" rx="8"/><text class="tb" x="588" y="48">API (services)</text>
  <rect class="db" x="800" y="20" width="150" height="44" rx="8"/><text class="tb" x="850" y="48">MySQL</text>
  <line class="life" x1="120" y1="64" x2="120" y2="545"/>
  <line class="life" x1="400" y1="64" x2="400" y2="545"/>
  <line class="life" x1="650" y1="64" x2="650" y2="545"/>
  <line class="life" x1="875" y1="64" x2="875" y2="545"/>

  <path class="arrow" d="M120 100 L648 100"/><text class="tl" x="135" y="92">1. POST /api/auth/login { username, password }</text>
  <path class="arrow" d="M650 135 L873 135"/><text class="tl" x="662" y="127">2. SELECT … Users JOIN Roles</text>
  <path class="darrow" d="M875 165 L652 165"/><text class="ts" x="668" y="158">user + PasswordHash + role name</text>
  <text class="tl" x="662" y="198">3. PasswordHasher verifies hash</text>
  <path class="arrow" d="M650 225 L873 225"/><text class="tl" x="662" y="217">4. INSERT UserActivity 'Login'</text>
  <path class="darrow" d="M650 258 L122 258"/><text class="tl" x="135" y="250">5. 200 { token, expiresAt, role }  (JWT: sub, unique_name, role, exp)</text>

  <path class="arrow" d="M120 315 L398 315"/><text class="tl" x="135" y="307">6. DELETE /api/movies/5 + Bearer token</text>
  <text class="tl" x="410" y="345">7. verify signature, issuer, audience, expiry</text>
  <path class="darrow" d="M400 375 L122 375"/><text class="ts" x="135" y="368">invalid / missing token → 401 Unauthorized</text>
  <text class="tl" x="410" y="410">8. check claim role = "Admin"</text>
  <path class="darrow" d="M400 438 L122 438"/><text class="ts" x="135" y="431">role "User" → 403 Forbidden</text>
  <path class="arrow" d="M400 475 L648 475"/><text class="tl" x="412" y="467">9. role "Admin" → controller</text>
  <path class="arrow" d="M650 505 L873 505"/><text class="tl" x="662" y="497">10. DELETE FROM Movies …</text>
  <path class="darrow" d="M650 535 L122 535"/><text class="tl" x="135" y="528">11. 204 No Content</text>
</svg>
